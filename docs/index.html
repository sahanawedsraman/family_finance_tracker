<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Finance Tracker</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign-in -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1><img src="logo.png" alt="Logo" class="app-logo"> Family Finance Tracker</h1>
      <p>Sign in with your Google account to view your finances.</p>
      <button id="btn-signin" class="btn-google" aria-label="Sign in with Google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="screen hidden">
    <header>
      <div class="header-left">
        <button id="btn-menu" class="btn-menu" aria-label="Menu">☰</button>
      </div>
      <div class="header-center">
        <a href="#" id="btn-home" aria-label="Go to overview">
          <img src="logo.png" alt="Logo" class="header-logo">
          <h1>Family Finance Tracker</h1>
        </a>
      </div>
      <div class="header-right">
        <button id="btn-privacy" class="btn-small" aria-label="Toggle privacy">👁️</button>
      </div>
    </header>

    <!-- Menu -->
    <div id="menu-overlay" class="menu-overlay"></div>
    <nav id="side-menu" class="side-menu">
      <div class="menu-header">
        <h2>Menu</h2>
        <button id="btn-menu-close" class="btn-menu-close">✕</button>
      </div>
      <div class="menu-items">
        <button class="menu-item active" data-tab="home">🏠 Overview</button>
        <button class="menu-item" data-tab="monthly">📊 Monthly</button>
        <button class="menu-item" data-tab="trips">✈️ Trips</button>
        <button class="menu-item" data-tab="transactions">📝 Transactions</button>
        <hr class="menu-divider">
        <button class="menu-item" id="menu-theme">🌙 Dark Mode</button>
        <button class="menu-item" id="menu-signout">🚪 Sign Out</button>
      </div>
    </nav>

    <!-- Time Filter -->
    <div class="time-filter">
      <select id="filter-year" aria-label="Filter by year"><option value="">All Years</option></select>
      <select id="filter-month" aria-label="Filter by month">
        <option value="">All Months</option>
        <option value="01">January</option><option value="02">February</option>
        <option value="03">March</option><option value="04">April</option>
        <option value="05">May</option><option value="06">June</option>
        <option value="07">July</option><option value="08">August</option>
        <option value="09">September</option><option value="10">October</option>
        <option value="11">November</option><option value="12">December</option>
      </select>
    </div>

    <!-- Overview -->
    <div id="tab-home" class="tab-panel active" role="tabpanel">
      <!-- Person Filter -->
      <div class="person-filter">
        <button class="person-btn active" data-person="">All</button>
        <button class="person-btn" data-person="Raman">Raman</button>
        <button class="person-btn" data-person="Sahana">Sahana</button>
      </div>

      <section class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label">Income</div>
          <div class="kpi-value" id="kpi-income">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Spending</div>
          <div class="kpi-value" id="kpi-spending">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Saved</div>
          <div class="kpi-value" id="kpi-saved">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Savings Rate</div>
          <div class="kpi-value" id="kpi-savings-rate">—</div>
        </div>
      </section>
      <section id="income-breakdown" class="kpi-grid" style="margin-top:1rem">
        <div class="kpi-card">
          <div class="kpi-label">Taxes Paid</div>
          <div class="kpi-value" id="kpi-taxes">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Retirement</div>
          <div class="kpi-value" id="kpi-retirement">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Healthcare</div>
          <div class="kpi-value" id="kpi-healthcare">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Invested</div>
          <div class="kpi-value" id="kpi-invested">—</div>
        </div>
      </section>
      <div class="chart-wrapper" style="margin-top:1rem">
        <canvas id="chart-category-ranking"></canvas>
      </div>
    </div>

    <!-- Monthly -->
    <div id="tab-monthly" class="tab-panel" role="tabpanel">
      <div class="chart-row">
        <div class="chart-wrapper"><canvas id="chart-income-expenses"></canvas></div>
        <div class="chart-wrapper"><canvas id="chart-savings-trend"></canvas></div>
      </div>
      <div id="monthly-table-container"></div>
    </div>

    <!-- Trips -->
    <div id="tab-trips" class="tab-panel" role="tabpanel">
      <div id="trips-container"></div>
    </div>

    <!-- Transactions -->
    <div id="tab-transactions" class="tab-panel" role="tabpanel">
      <div class="table-controls">
        <input type="text" id="txn-search" placeholder="Search..." aria-label="Search transactions">
        <select id="txn-person-filter" aria-label="Filter by person"><option value="">All People</option></select>
        <select id="txn-category-filter" aria-label="Filter by category"><option value="">All Categories</option></select>
        <select id="txn-type-filter" aria-label="Filter by type">
          <option value="">All Types</option>
          <option value="debit">Expenses</option>
          <option value="credit">Income</option>
        </select>
      </div>
      <div id="transactions-table-container"></div>
    </div>

    <footer>
      <p>Last updated: <span id="last-updated">—</span></p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
