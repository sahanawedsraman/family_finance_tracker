<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Finance Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign-in screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1>💰 Family Finance Tracker</h1>
      <p>Sign in with your Google account to view your finances.</p>
      <button id="btn-signin" class="btn-google" aria-label="Sign in with Google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="screen hidden">
    <header>
      <div class="header-left">
        <h1>💰 Family Finance Tracker</h1>
      </div>
      <div class="header-right">
        <span id="user-name"></span>
        <button id="btn-refresh" class="btn-small" aria-label="Refresh data">🔄 Refresh</button>
        <button id="btn-signout" class="btn-small" aria-label="Sign out">Sign Out</button>
      </div>
    </header>

    <!-- Global Time Filter -->
    <div class="time-filter" aria-label="Time period filter">
      <select id="filter-year" aria-label="Filter by year">
        <option value="">All Years</option>
      </select>
      <select id="filter-month" aria-label="Filter by month">
        <option value="">All Months</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
    </div>

    <!-- KPI Cards -->
    <section id="kpi-section" class="kpi-grid" aria-label="Key Performance Indicators">
      <div class="kpi-card">
        <div class="kpi-label">Savings Rate</div>
        <div class="kpi-value" id="kpi-savings-rate">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Budget</div>
        <div class="kpi-value" id="kpi-total-budget">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Spending</div>
        <div class="kpi-value" id="kpi-total-spending">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Budget Health</div>
        <div class="kpi-value" id="kpi-budget-health">—</div>
      </div>
    </section>

    <!-- Insights -->
    <section id="insights-section" class="insights-container" aria-label="Financial Insights">
      <div id="insights-list"></div>
    </section>    <!-- Tab Navigation -->
    <nav class="tabs" role="tablist" aria-label="Dashboard sections">
      <button class="tab active" role="tab" aria-selected="true" data-tab="monthly">Monthly Summary</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="annual">Annual Summary</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="categories">Categories</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="budget">Budget Status</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="transactions">Transactions</button>
    </nav>

    <!-- Tab Panels -->
    <div id="tab-monthly" class="tab-panel active" role="tabpanel">
      <div class="chart-row">
        <canvas id="chart-income-expenses" aria-label="Income vs Expenses chart"></canvas>
        <canvas id="chart-savings-trend" aria-label="Savings trend chart"></canvas>
      </div>
      <div id="monthly-table-container"></div>
    </div>

    <div id="tab-annual" class="tab-panel" role="tabpanel">
      <div class="chart-row">
        <canvas id="chart-annual-income-expenses" aria-label="Annual income vs expenses chart"></canvas>
        <canvas id="chart-annual-savings" aria-label="Annual savings chart"></canvas>
      </div>
      <div id="annual-table-container"></div>
    </div>

    <div id="tab-categories" class="tab-panel" role="tabpanel">
      <div class="chart-row">
        <canvas id="chart-category-pie" aria-label="Spending by category pie chart"></canvas>
        <canvas id="chart-category-bar" aria-label="Category spending bar chart"></canvas>
      </div>
    </div>

    <div id="tab-budget" class="tab-panel" role="tabpanel">
      <div class="chart-single">
        <canvas id="chart-budget" aria-label="Budget vs actual spending chart"></canvas>
      </div>
      <div id="budget-table-container"></div>
    </div>

    <div id="tab-transactions" class="tab-panel" role="tabpanel">
      <div class="table-controls">
        <input type="text" id="txn-search" placeholder="Search transactions..." aria-label="Search transactions">
        <select id="txn-person-filter" aria-label="Filter by person">
          <option value="">All People</option>
        </select>
        <select id="txn-category-filter" aria-label="Filter by category">
          <option value="">All Categories</option>
        </select>
      </div>
      <div id="transactions-table-container"></div>
    </div>

    <footer>
      <p>Data last updated from Google Sheets. Run the CLI to refresh.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
